dataset:
  image_transforms:
    enable: true
    max_num_transforms: 6  # All transforms except crop_scale
    random_order: false
    tfs:
      # Disable RandomResizedCrop by setting weight to 0
      crop_scale:
        weight: 0.0
        type: "RandomResizedCrop"
        kwargs:
          size: [224, 224]
          scale: [0.8, 1.0]
          ratio: [0.75, 1.33]
      
      # Keep all other transforms enabled
      rotate:
        weight: 1.0
        type: "RandomRotation"
        kwargs:
          degrees: 30
      
      brightness:
        weight: 1.0
        type: "ColorJitter"
        kwargs:
          brightness: [0.8, 1.2]
      
      contrast:
        weight: 1.0
        type: "ColorJitter"
        kwargs:
          contrast: [0.8, 1.2]
      
      saturation:
        weight: 1.0
        type: "ColorJitter"
        kwargs:
          saturation: [0.5, 1.5]
      
      hue:
        weight: 1.0
        type: "ColorJitter"
        kwargs:
          hue: [-0.05, 0.05]
      
      sharpness:
        weight: 1.0
        type: "SharpnessJitter"
        kwargs:
          sharpness: [0.5, 1.5] 